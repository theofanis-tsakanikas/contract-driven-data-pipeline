# Dependabot — deliberately configured for a pinned reference implementation.
#
# `open-pull-requests-limit: 0` switches OFF *version-update* pull requests (the routine
# "bump X from 1.2 to 1.3" noise). That is intentional, not neglect: this repository is a
# reference implementation pinned to a dependency set the CI suite was validated against
# (Airflow 2.11 · Spark 3.5.2 · pandas 2.1.4 · numpy 1.26.4), and several of those pins must
# move together or not at all.
#
# It was left on for one afternoon, and produced seventeen pull requests in minutes — pandas
# 2→3, numpy 1→2, both Airflow providers across majors, and the base image from Airflow 2.11
# to 3.3. Every one of them passed all five checks, because at the time nothing installed
# infra/requirements-*.txt or built the images. Green ticks on untested upgrades are worse
# than no ticks at all.
#
# What stays ON is the part that matters: **Dependabot security updates and alerts** (a
# separate repository setting) still raise a pull request when a dependency carries an actual
# advisory. Real vulnerabilities get a PR; cosmetic bumps do not.
#
# Two things now make a deliberate, hand-driven upgrade safe to review:
#   * the `test` job installs `-r requirements-dev.txt`, which pulls in the same
#     infra/requirements-spark.txt the image ships — so the tests exercise the real pins;
#   * tests/test_dependency_pins.py fails if the Airflow version drifts between the base
#     image, the dag-validate install and the constraints URL, or if a package pinned in both
#     images stops agreeing.
#
# To resume routine updates, raise the limit (5 is a sane value), prefer `interval: monthly`
# with `groups:` so an ecosystem arrives as one reviewable PR instead of a dozen, and add a
# job that builds both Dockerfiles.
version: 2
updates:
  # --- Python dependencies (the two container images) ---
  - package-ecosystem: "pip"
    directory: "/infra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "python"

  # --- Python dependencies (the Streamlit dashboard, deployed standalone) ---
  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "python"

  # --- GitHub Actions workflow dependencies ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "ci"

  # --- Container base images (Airflow + Spark) ---
  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "docker"

  # --- Terraform providers (main config + the one-time bootstrap) ---
  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "terraform"

  - package-ecosystem: "terraform"
    directory: "/infra/terraform/bootstrap"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "terraform"
